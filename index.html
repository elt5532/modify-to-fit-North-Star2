<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetMatch: Full Room Playground</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="playground-wrapper">
    <!-- Top Bar -->
    <header class="top-bar">
        <div class="brand">
            <div class="logo-icon">🐾</div>
            <div>
                <h1>PetMatch: Full Room Playground</h1>
                <p>Interactive 2.5D Co-Play Experience</p>
            </div>
        </div>
        <div class="top-controls">
            <button id="soundBtn" class="pill-btn"><span id="soundIcon">🔊</span> Sound: <span id="soundStatus">ON</span></button>
            <button id="resetBtn" class="pill-btn reset-btn">🔄 Reset Pets</button>
        </div>
    </header>

    <!-- Pet Status Cards & Center Banner -->
    <div class="status-header">
        <div class="pet-card dog-card">
            <div class="avatar dog-avatar"></div>
            <div class="pet-info">
                <div class="pet-name-line">
                    <strong>Barnaby</strong>
                    <span class="badge dog-badge" id="barnabyBadge">Roaming</span>
                </div>
                <div class="progress-bar-bg"><div class="progress-fill dog-fill" id="barnabyEnergy"></div></div>
            </div>
        </div>

        <div class="notice-banner" id="noticeBanner">
            😊 Barnaby & Mimi are freely exploring the room!
        </div>

        <div class="pet-card cat-card">
            <div class="pet-info text-right">
                <div class="pet-name-line right">
                    <span class="badge cat-badge" id="mimiBadge">Exploring</span>
                    <strong>Mimi</strong>
                </div>
                <div class="progress-bar-bg"><div class="progress-fill cat-fill" id="mimiEnergy"></div></div>
            </div>
            <div class="avatar cat-avatar"></div>
        </div>
    </div>

    <!-- 2.5D Playground Canvas -->
    <div class="canvas-container">
        <canvas id="roomCanvas" width="960" height="480"></canvas>
    </div>

    <!-- Bottom Toy Selection Toolbar -->
    <footer class="toy-toolbar">
        <div class="toy-group">
            <span class="group-label">🐕 DOG TOYS:</span>
            <button class="toy-btn dog-toy active" data-type="dog" data-toy="Ball">Ball</button>
            <button class="toy-btn dog-toy" data-type="dog" data-toy="Bone">Bone</button>
            <button class="toy-btn dog-toy" data-type="dog" data-toy="Tug Rope">Tug Rope</button>
        </div>

        <div class="toy-group">
            <span class="group-label">🐈 CAT TOYS:</span>
            <button class="toy-btn cat-toy" data-type="cat" data-toy="Laser">Laser</button>
            <button class="toy-btn cat-toy" data-type="cat" data-toy="Wand">Wand</button>
            <button class="toy-btn cat-toy" data-type="cat" data-toy="Yarn">Yarn</button>
            <button class="toy-btn cat-toy" data-type="cat" data-toy="Mouse">Mouse</button>
        </div>
    </footer>
</div>

<script src="script.js"></script>
</body>
</html>
